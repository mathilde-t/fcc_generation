ee_ll:
  description: "Z → l+l- at FCC-ee (Z pole)"
  process_dir: "z_prod_ll"
  ebeam: 45.6
  nevents: 100
  output_tag: "ee_ll_ecm91"

  mg5:
    model: "sm"
    process: |
      define l+ = e+ mu+ ta+
      define l- = e- mu- ta-
      generate e+ e- > l+ l-

  pythia:
    lhe_file: "ee_ll_ecm91.lhe"


ee_ee:
  description: "Z → e+e- at FCC-ee (Z pole)"
  process_dir: "z_prod_ee"
  ebeam: 45.6
  nevents: 100
  output_tag: "ee_ee_ecm91"

  mg5:
    model: "sm"
    process:
      generate e+ e- > e+ e-

    cuts:
      etal: 10.0
      ptl: 0.0
      drll: 0.0
      mmll: 5.0
      mmllmax: 150.0

  pythia:
    lhe_file: "ee_ee_ecm91.lhe"

ee_ee_def:
  description: "Z → e+e- at FCC-ee (Z pole)"
  process_dir: "z_prod_ee"
  ebeam: 45.6
  nevents: 100
  output_tag: "ee_ee_ecm91"

  mg5:
    model: "sm"
    process: |
      define l = e+ e-
      generate e+ e- > l l

    cuts:
      etal: 10.0
      ptl: 0.0
      drll: 0.0
      mmll: 5.0
      mmllmax: 150.0

  pythia:
    lhe_file: "ee_ee_ecm91.lhe"


